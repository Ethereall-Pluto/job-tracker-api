name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t job-tracker-api .
      - name: Start container and check the API answers
        run: |
          docker run -d --name api -p 8000:8000 job-tracker-api
          for i in $(seq 1 20); do curl -sf localhost:8000/applications && exit 0; sleep 1; done
          docker logs api
          exit 1
